<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142820"/>
      <stop offset="50%" stop-color="#1b382b"/>
      <stop offset="100%" stop-color="#0f1b15"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7d6e0"/>
      <stop offset="50%" stop-color="#f4acb7"/>
      <stop offset="100%" stop-color="#e29578"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#deb887"/>
      <stop offset="100%" stop-color="#c69c6d"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="100%" stop-color="#1a0f0a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with lush foliage tones -->
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>

  <!-- Botanical leaves ambient shapes in background -->
  <path d="M 40,80 C 70,40 120,50 110,100 C 100,150 40,120 40,80 Z" fill="url(#leafGrad)" opacity="0.6"/>
  <path d="M 320,60 C 360,30 380,90 350,130 C 310,140 300,90 320,60 Z" fill="url(#leafGrad)" opacity="0.7"/>
  <path d="M 330,190 C 380,180 390,240 350,260 C 310,260 300,210 330,190 Z" fill="url(#leafGrad)" opacity="0.5"/>
  <path d="M 20,220 C 50,200 80,230 60,270 C 30,290 10,250 20,220 Z" fill="url(#leafGrad)" opacity="0.6"/>

  <!-- Soft vignette glow -->
  <circle cx="200" cy="180" r="140" fill="#2d6a4f" opacity="0.2"/>

  <!-- Behind hair -->
  <path d="M 120,150 C 110,230 110,310 135,350 C 145,350 155,270 155,230 Z" fill="url(#hairGrad)"/>
  <path d="M 280,150 C 290,230 290,310 265,350 C 255,350 245,270 245,230 Z" fill="url(#hairGrad)"/>

  <!-- Neck -->
  <rect x="180" y="215" width="40" height="60" rx="8" fill="url(#skinGrad)" filter="url(#shadow)"/>
  <!-- Thin delicate necklace -->
  <path d="M 182,255 Q 200,270 218,255" fill="none" stroke="#d4af37" stroke-width="2"/>
  <circle cx="200" cy="268" r="3" fill="#d4af37"/>

  <!-- Shirt / Shoulders (Light Pastel Pink) -->
  <path d="M 100,320 C 110,270 150,260 175,265 L 188,310 L 212,310 L 225,265 C 250,260 290,270 300,320 L 320,400 L 80,400 Z" fill="url(#shirtGrad)" filter="url(#shadow)"/>
  <!-- Shirt Collar Details -->
  <polygon points="175,265 198,310 180,315" fill="#fce4ec"/>
  <polygon points="225,265 202,310 220,315" fill="#fce4ec"/>
  <line x1="200" y1="315" x2="200" y2="400" stroke="#f48fb1" stroke-width="2"/>
  <circle cx="200" cy="335" r="2.5" fill="#ffffff"/>
  <circle cx="200" cy="365" r="2.5" fill="#ffffff"/>
  <circle cx="200" cy="395" r="2.5" fill="#ffffff"/>

  <!-- Face -->
  <ellipse cx="200" cy="175" rx="52" ry="62" fill="url(#skinGrad)" filter="url(#shadow)"/>

  <!-- Warm Eyes -->
  <ellipse cx="180" cy="170" rx="5" ry="3.5" fill="#1a0f0a"/>
  <ellipse cx="220" cy="170" rx="5" ry="3.5" fill="#1a0f0a"/>
  <circle cx="181" cy="168.5" r="1.5" fill="#ffffff"/>
  <circle cx="221" cy="168.5" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M 172,160 Q 182,156 190,162" fill="none" stroke="#2c1810" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 228,160 Q 218,156 210,162" fill="none" stroke="#2c1810" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Gentle Nose -->
  <path d="M 198,172 L 197,188 L 204,188" fill="none" stroke="#b08968" stroke-width="2" stroke-linecap="round"/>

  <!-- Warm Smile -->
  <path d="M 183,205 Q 200,222 217,205" fill="#ffffff" stroke="#9d0208" stroke-width="1.5"/>
  <path d="M 181,204 Q 200,226 219,204" fill="none" stroke="#9d0208" stroke-width="2" stroke-linecap="round"/>

  <!-- Hair (Dark, parted naturally, framing face) -->
  <path d="M 148,175 C 145,115 170,95 200,95 C 235,95 255,115 252,175 C 248,150 238,125 200,125 C 162,125 152,150 148,175 Z" fill="url(#hairGrad)"/>
  <!-- Hair locks framing sides -->
  <path d="M 148,170 C 142,205 142,250 152,280 C 158,280 155,220 155,185 Z" fill="url(#hairGrad)"/>
  <path d="M 252,170 C 258,205 258,250 248,280 C 242,280 245,220 245,185 Z" fill="url(#hairGrad)"/>

  <!-- Framing border ring -->
  <rect x="2" y="2" width="396" height="396" rx="38" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.3"/>
</svg>
